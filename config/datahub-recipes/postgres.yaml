pipeline_name: "postgres-main"

source:
  type: "postgres"
  config:
    host_port: "127.0.0.1:${POSTGRES_PORT}"
    database: "${POSTGRES_DB}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    include_tables: true
    include_views: true
    profiling:
        enabled: true
        profile_table_level_only: true
    stateful_ingestion:
        enabled: true
sink:
  type: "datahub-rest"
  config:
    server: "${DATAHUB_GMS_URL}"
