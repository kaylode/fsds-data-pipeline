# Trino catalog: connects to Hive Metastore and reads files from MinIO

connector.name=hive

# Hive Metastore address
hive.metastore.uri=thrift://127.0.0.1:9083
hive.metastore-timeout=60s
hive.metastore.thrift.client.max-retry-time=120s

# MinIO / S3 settings (fs.native-s3 required for Trino 480+)
fs.native-s3.enabled=true
s3.endpoint=http://127.0.0.1:9000
s3.region=us-east-1
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.path-style-access=true

# Old config (Trino < 480, hive.s3.* properties)
#hive.s3.endpoint=http://minio:9000
#hive.s3.aws-access-key=minioadmin
#hive.s3.aws-secret-key=minioadmin
#hive.s3.path-style-access=true
#hive.s3.ssl.enabled=false

# Allow creating/dropping tables and schemas from Trino
hive.non-managed-table-writes-enabled=true
