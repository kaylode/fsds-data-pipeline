# ── Delta Lake (Spark 3.5.x, Scala 2.12) ──────────────────────────────────────
# NOTE: artifact uses _2.12 suffix — Spark 3.5.3 image is built with Scala 2.12
# Delta 3.3.0 is the latest release that officially supports Spark 3.5.x
spark.jars.packages                              io.delta:delta-spark_2.12:3.3.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
spark.sql.extensions                             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog

# ── S3A / MinIO ────────────────────────────────────────────────────────────────
# Uses path-style access (required for non-AWS S3 endpoints like MinIO)
spark.hadoop.fs.s3a.endpoint                     http://127.0.0.1:9000
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled       false
spark.hadoop.fs.s3a.access.key                   minioadmin
spark.hadoop.fs.s3a.secret.key                   minioadmin

# ── Performance (tuned for single-node local dev) ──────────────────────────────
# AQE auto-handles skew (matches the approach in 2_process_skew_data.py)
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.skewJoin.enabled              true
# 8 shuffle partitions is appropriate for coursework data volumes (~150k rows)
spark.sql.shuffle.partitions                     8
spark.sql.debug.maxToStringFields                100

# ── Event Logging (Spark History Server) ──────────────────────────────────────
spark.eventLog.enabled                           true
spark.eventLog.dir                               file:///opt/spark/logs
spark.history.fs.logDirectory                    file:///opt/spark/logs
