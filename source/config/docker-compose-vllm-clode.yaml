services:
  llm-server:
    image: vllm/vllm-openai:cu130-nightly
    container_name: minimax-m2.7-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - HF_HOME=/root/.cache/huggingface
      - NCCL_P2P_LEVEL=4
      - SAFETENSORS_FAST_GPU=1
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
      - VLLM_USE_FLASHINFER_MOE_FP4=1
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_FLASHINFER_MOE_BACKEND=latency
    ports:
      - "8000:8000"
    volumes:
      - $HF_HOME:/root/.cache/huggingface
    ipc: host
    command:
      - "lukealonso/MiniMax-M2.7-NVFP4"
      - "--trust-remote-code"
      - "--served-model-name"
      - "MiniMax-M2.7"
      - "--gpu-memory-utilization"
      - "0.95"
      - "--max-num-seqs"
      - "16"
      - "--enable-chunked-prefill"
      - "--enable-prefix-caching"
      - "--max-num-batched-tokens"
      - "16384"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "minimax_m2"
      - "--reasoning-parser"
      - "minimax_m2"
      - "--quantization"
      - "modelopt_fp4"
      - "--kv-cache-dtype"
      - "fp8"
      - "--dtype"
      - "auto"
      - "--attention-backend"
      - "FLASHINFER"
      - "--load-format"
      - "fastsafetensors"
      - "--tensor-parallel-size"
      - "2"
      - "--port"
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 100
      start_period: 300s
    networks:
      - llm-net

networks:
  llm-net:
    driver: bridge