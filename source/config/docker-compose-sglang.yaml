# config/docker-compose-sglang.yaml
# Isolated SGLang Inference API server configuration for GPU accelerated model inference under rootless Podman

version: '3.8'

services:
  sglang-llm:
    image: ${SGLANG_IMAGE}
    container_name: sglang-llm
    ipc: host
    network_mode: host
    environment:
      LANG: en_US.utf-8
      LC_ALL: en_US.UTF-8
      LD_LIBRARY_PATH: /usr/lib64-nvidia
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs
      SGLANG_LLM_EXPOSE_PORT: ${SGLANG_LLM_EXPOSE_PORT}
    devices:
      - "/dev/nvidiactl:/dev/nvidiactl"
      - "/dev/nvidia-uvm:/dev/nvidia-uvm"
      - "/dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools"
      - "/dev/nvidia0:/dev/nvidia0"
      - "/dev/nvidia1:/dev/nvidia1"
      - "/dev/nvidia2:/dev/nvidia2"
      - "/dev/nvidia3:/dev/nvidia3"
      - "/dev/nvidia4:/dev/nvidia4"
      - "/dev/nvidia5:/dev/nvidia5"
      - "/dev/nvidia6:/dev/nvidia6"
    volumes:
      - "../.tmp/cache/pip:/root/.cache/pip"
      - "/usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro"
      - "${SGLANG_LLM_CKPT_DIR}:/sgl-workspace/llm"
      - "/usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib64-nvidia/libcuda.so.1:ro"
      - "/usr/lib/x86_64-linux-gnu/libcuda.so.555.42.06:/usr/lib64-nvidia/libcuda.so.555.42.06:ro"
      - "/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib64-nvidia/libnvidia-ml.so.1:ro"
      - "/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.555.42.06:/usr/lib64-nvidia/libnvidia-ml.so.555.42.06:ro"
      - "/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:/usr/lib64-nvidia/libnvidia-ptxjitcompiler.so.1:ro"
      - "/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.555.42.06:/usr/lib64-nvidia/libnvidia-ptxjitcompiler.so.555.42.06:ro"
      - "/usr/lib/x86_64-linux-gnu/libnvidia-allocator.so.1:/usr/lib64-nvidia/libnvidia-allocator.so.1:ro"
      - "/usr/lib/x86_64-linux-gnu/libnvidia-allocator.so.555.42.06:/usr/lib64-nvidia/libnvidia-allocator.so.555.42.06:ro"
    entrypoint: /bin/bash
    command: >
      -c "
      ldconfig /usr/lib64-nvidia &&
      pip install 'vllm==0.9.2' --break-system-packages &&
      pip install mamba-ssm causal-conv1d --no-build-isolation 'torch==2.7.0' 'triton==3.3.0' --break-system-packages &&
      python3 -m sglang.launch_server
      --model-path /sgl-workspace/llm
      --host 0.0.0.0
      --port $$SGLANG_LLM_EXPOSE_PORT
      --max-running-requests 8
      --mem-fraction-static 0.9
      --sampling-backend pytorch
      --disable-cuda-graph
      --trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]