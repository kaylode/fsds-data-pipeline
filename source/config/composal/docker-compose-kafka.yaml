# Simplified Kafka setup for local development (KRaft mode - no ZooKeeper needed)
# Reconfigured to use network_mode: host, x-podman.uidmaps/gidmaps extensions, and direct /tmp bind mounts for 100% rootless Podman compatibility
version: '3.8'

services:
  kafka:
    image: docker.io/confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    network_mode: host
    user: "1000:1000"
    working_dir: /tmp
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      # These settings configure Kafka to run in KRaft mode (no ZooKeeper)
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:${KAFKA_CONTROLLER_PORT}"
      # Kafka listeners and advertised listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Advertise different addresses for internal vs external clients
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Optional: Set a unique cluster ID for KRaft mode
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    volumes:
      - ../../.tmp/kafka-data:/var/lib/kafka/data

  postgres:
    image: docker.io/library/postgres:15-alpine
    hostname: postgres
    container_name: postgres
    network_mode: host
    user: "999:999"
    x-podman.uidmaps:
      - "999:0:1"
    x-podman.gidmaps:
      - "999:0:1"
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
      - PGPORT=$POSTGRES_PORT
    volumes:
      - ../../.tmp/postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical"]

  # It is essentially Kafka Connect with the Debezium connector pre-installed.
  debezium:
    image: docker.io/debezium/connect:2.5
    hostname: debezium
    container_name: debezium
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      BOOTSTRAP_SERVERS: 127.0.0.1:${KAFKA_PORT}
      CONNECT_REST_PORT: ${DEBEZIUM_PORT}
      # The group ID is used by Kafka Connect to manage consumer groups for connectors.
      GROUP_ID: 1
      # These topics are used by Kafka Connect to store connector configurations, offsets, and statuses
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      # Set replication factors to 1 for single broker
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - kafka
      - postgres

  schema-registry:
    image: docker.io/confluentinc/cp-schema-registry:latest
    hostname: schema-registry
    container_name: schema-registry
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: 127.0.0.1
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:${SCHEMA_REGISTRY_PORT}
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 127.0.0.1:${KAFKA_PORT}
    depends_on:
      - kafka

  redpanda-console:
    image: docker.io/redpandadata/console:latest
    hostname: redpanda-console
    container_name: redpanda-console
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      SERVER_LISTEN_PORT: ${REDPANDA_CONSOLE_PORT}
      KAFKA_BROKERS: 127.0.0.1:${KAFKA_PORT}
      KAFKA_STARTUP_ESTABLISHCONNECTIONEAGERLY: "false"
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://127.0.0.1:${SCHEMA_REGISTRY_PORT}
      # These config options enable Kafka Connect integration in Redpanda Console
      CONNECT_ENABLED: true
      CONNECT_CLUSTERS_NAME: debezium
      CONNECT_CLUSTERS_URL: http://127.0.0.1:${DEBEZIUM_PORT}
    depends_on:
      - kafka
      - schema-registry

  pgweb:
    image: docker.io/sosedoff/pgweb:latest
    hostname: pgweb
    container_name: pgweb
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    command: ["/pgweb", "--bind=0.0.0.0", "--listen=${PGWEB_PORT}"]
    depends_on:
      - postgres