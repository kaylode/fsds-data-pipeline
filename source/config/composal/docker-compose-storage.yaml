# config/docker-compose-storage.yaml
# Lakehouse storage stack (MinIO + Hive Metastore + Trino) configured for rootless Podman compatibility

version: "3.8"

services:
  minio:
    image: docker.io/minio/minio:latest
    container_name: minio
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    ports:
      - "${MINIO_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Web UI console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ../../.tmp/minio-data:/data

  metastore-db:
    image: docker.io/library/postgres:15-alpine
    container_name: metastore-db
    user: "999:999"
    x-podman.uidmaps:
      - "999:0:1"
    x-podman.gidmaps:
      - "999:0:1"
    ports:
      - "${METASTORE_DB_PORT:-5433}:5432"   # Map to host port to avoid conflict with core Postgres on 5432
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - ../../.tmp/metastore-db-data:/var/lib/postgresql/data

  hive-metastore:
    image: docker.io/starburstdata/hive:3.1.2-e.18
    container_name: hive-metastore
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"   # Access via Thrift protocol
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    depends_on:
      - minio
      - metastore-db

  trino:
    image: docker.io/trinodb/trino:480
    container_name: trino
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    ports:
      - "${TRINO_PORT:-8090}:8080"   # Map to host port to avoid conflict with Airflow on 8082
    volumes:
      - ../resources/l8_storage_layer/conf/trino/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore
