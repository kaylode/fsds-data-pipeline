  #     python3 -c \"content = open('/sgl-workspace/sglang/python/sglang/srt/openai_api/adapter.py').read(); open('/sgl-workspace/sglang/python/sglang/srt/openai_api/adapter.py', 'w').write(content.replace('if assistant_prefix:', 'if (isinstance(prompt_ids, dict) or hasattr(prompt_ids, \\\"keys\\\")) and \\\"input_ids\\\" in prompt_ids:\\n                    prompt_ids = prompt_ids[\\\"input_ids\\\"]\\n\\n                if assistant_prefix:'))\" &&
