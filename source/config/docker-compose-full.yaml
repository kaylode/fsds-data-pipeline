# Simplified Kafka setup for local development (KRaft mode - no ZooKeeper needed)
# Reconfigured to use network_mode: host, x-podman.uidmaps/gidmaps extensions, and direct /tmp bind mounts for 100% rootless Podman compatibility
version: '3.8'

services:
  kafka:
    image: docker.io/confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    network_mode: host
    user: "1000:1000"
    working_dir: /tmp
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      # These settings configure Kafka to run in KRaft mode (no ZooKeeper)
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:${KAFKA_CONTROLLER_PORT:-9093}"
      # Kafka listeners and advertised listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Advertise different addresses for internal vs external clients
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${KAFKA_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Optional: Set a unique cluster ID for KRaft mode
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    volumes:
      - ../../.tmp/kafka-data:/var/lib/kafka/data

  postgres:
    image: docker.io/library/postgres:15-alpine
    hostname: postgres
    container_name: postgres
    network_mode: host
    user: "999:999"
    x-podman.uidmaps:
      - "999:0:1"
    x-podman.gidmaps:
      - "999:0:1"
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
      - PGPORT=$POSTGRES_PORT
    volumes:
      - ../../.tmp/postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "wal_level=logical"]

  # It is essentially Kafka Connect with the Debezium connector pre-installed.
  debezium:
    image: docker.io/debezium/connect:2.5
    hostname: debezium
    container_name: debezium
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      BOOTSTRAP_SERVERS: 127.0.0.1:${KAFKA_PORT}
      CONNECT_REST_PORT: ${DEBEZIUM_PORT}
      # The group ID is used by Kafka Connect to manage consumer groups for connectors.
      GROUP_ID: 1
      # These topics are used by Kafka Connect to store connector configurations, offsets, and statuses
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      # Set replication factors to 1 for single broker
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - kafka
      - postgres

  schema-registry:
    image: docker.io/confluentinc/cp-schema-registry:latest
    hostname: schema-registry
    container_name: schema-registry
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: 127.0.0.1
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:${SCHEMA_REGISTRY_PORT}
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 127.0.0.1:${KAFKA_PORT}
    depends_on:
      - kafka

  redpanda-console:
    image: docker.io/redpandadata/console:latest
    hostname: redpanda-console
    container_name: redpanda-console
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      SERVER_LISTENPORT: ${REDPANDA_CONSOLE_PORT}
      KAFKA_BROKERS: 127.0.0.1:${KAFKA_PORT}
      KAFKA_STARTUP_ESTABLISHCONNECTIONEAGERLY: "false"
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://127.0.0.1:${SCHEMA_REGISTRY_PORT}
      # These config options enable Kafka Connect integration in Redpanda Console
      CONNECT_ENABLED: true
      CONNECT_CLUSTERS_NAME: debezium
      CONNECT_CLUSTERS_URL: http://127.0.0.1:${DEBEZIUM_PORT}
    depends_on:
      - kafka
      - schema-registry

  pgweb:
    image: docker.io/sosedoff/pgweb:latest
    hostname: pgweb
    container_name: pgweb
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    command: /pgweb --bind=0.0.0.0 --listen=${PGWEB_PORT}
    depends_on:
      - postgres

  minio:
    image: docker.io/minio/minio:latest
    container_name: minio
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --address ":${MINIO_PORT:-9000}" --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - ../../.tmp/minio-data:/data

  hive-metastore:
    image: docker.io/starburstdata/hive:3.1.2-e.18
    container_name: hive-metastore
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:-5432}/${METASTORE_DB_NAME:-metastore}
      HIVE_METASTORE_USER: ${METASTORE_DB_USER:-hive}
      HIVE_METASTORE_PASSWORD: ${METASTORE_DB_PASSWORD:-hive}
      S3_ENDPOINT: http://127.0.0.1:${MINIO_PORT:-9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    depends_on:
      - postgres
      - minio

  trino:
    image: docker.io/trinodb/trino:480
    container_name: trino
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      METASTORE_DB_NAME: ${METASTORE_DB_NAME:-metastore}
      METASTORE_DB_USER: ${METASTORE_DB_USER:-hive}
      METASTORE_DB_PASSWORD: ${METASTORE_DB_PASSWORD:-hive}
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog
      - ./conf/trino/config.properties:/etc/trino/config.properties
    depends_on:
      - hive-metastore

  opensearch:
    image: docker.io/opensearchproject/opensearch:2.19.3
    hostname: search
    container_name: datahub-opensearch
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx1024m"
      # Disable ISM plugin — DataHub does not need it and it causes
      # .opendistro-ism-config shard-not-found errors on fresh/restarted nodes
      plugins.index_state_management.enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=0s'"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 60s

  datahub-system-update:
    image: docker.io/acryldata/datahub-upgrade:v1.5.0.6
    hostname: datahub-system-update
    container_name: datahub-system-update
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    command: ["-u", "SystemUpdate"]
    depends_on:
      postgres:
        condition: service_started
      opensearch:
        condition: service_healthy
    environment:
      EBEAN_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:-5432}/${DATAHUB_DB_NAME:-datahub}"
      EBEAN_DATASOURCE_DRIVER: "org.postgresql.Driver"
      EBEAN_DATASOURCE_USERNAME: ${DATAHUB_DB_USER:-datahub}
      EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_DB_PASSWORD:-datahub_password}
      EBEAN_DATASOURCE_HOST: 127.0.0.1:${POSTGRES_PORT:-5432}
      ELASTICSEARCH_HOST: 127.0.0.1
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS: "3"
      ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES: "false"
      KAFKA_BOOTSTRAP_SERVER: 127.0.0.1:${KAFKA_PORT:-9092}
      GRAPH_SERVICE_IMPL: elasticsearch
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      DATAHUB_SQL_SETUP_ENABLED: "true"
      DATAHUB_PRECREATE_TOPICS: "true"
      METADATA_SERVICE_AUTH_ENABLED: "false"
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: "WnEdIeTG/VVCLQqGwC/BAkqyY0k+H8NEAtWGejrBI94="
      DATAHUB_TOKEN_SERVICE_SALT: "YouKnowNothingJohnSnow"
      DATAHUB_GMS_HOST: 127.0.0.1
      DATAHUB_GMS_PORT: "${DATAHUB_GMS_PORT:-8088}"
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
      KAFKA_SCHEMAREGISTRY_URL: "http://127.0.0.1:${DATAHUB_GMS_PORT:-8088}/schema-registry/api/"
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
      ENTITY_VERSIONING_ENABLED: "true"
      PARTITIONS: "3"

  datahub-gms:
    image: docker.io/acryldata/datahub-gms:v1.5.0.6
    hostname: datahub-gms
    container_name: datahub-gms
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    environment:
      EBEAN_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:-5432}/${DATAHUB_DB_NAME:-datahub}"
      EBEAN_DATASOURCE_DRIVER: "org.postgresql.Driver"
      EBEAN_DATASOURCE_USERNAME: ${DATAHUB_DB_USER:-datahub}
      EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_DB_PASSWORD:-datahub_password}
      EBEAN_DATASOURCE_HOST: 127.0.0.1:${POSTGRES_PORT:-5432}
      ELASTICSEARCH_HOST: 127.0.0.1
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_PROTOCOL: http
      ELASTICSEARCH_USE_SSL: "false"
      ELASTICSEARCH_IMPLEMENTATION: opensearch
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_LIMIT_RESULTS_STRICT: "true"
      ES_BULK_REFRESH_POLICY: WAIT_UNTIL
      SERVER_PORT: "${DATAHUB_GMS_PORT:-8088}"
      KAFKA_BOOTSTRAP_SERVER: 127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_SCHEMAREGISTRY_URL: "http://127.0.0.1:${DATAHUB_GMS_PORT:-8088}/schema-registry/api/"
      GRAPH_SERVICE_IMPL: elasticsearch
      GRAPH_SERVICE_DIFF_MODE_ENABLED: "false"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      METADATA_SERVICE_AUTH_ENABLED: "false"
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: "WnEdIeTG/VVCLQqGwC/BAkqyY0k+H8NEAtWGejrBI94="
      DATAHUB_TOKEN_SERVICE_SALT: "YouKnowNothingJohnSnow"
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-gms
      SCHEMA_REGISTRY_TYPE: INTERNAL
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      PE_CONSUMER_ENABLED: "true"
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      ENTITY_VERSIONING_ENABLED: "true"
      UI_INGESTION_ENABLED: "true"
      ALTERNATE_MCP_VALIDATION: "true"
      CONFIG_ENTITY_REGISTRY_USE_OPTIMIZED_LOADING: "true"
      EXTRACT_JAR_ENABLED: "true"
      STRICT_URN_VALIDATION_ENABLED: "true"
      SEARCH_BAR_API_VARIANT: SEARCH_ACROSS_ENTITIES
      POLICY_CACHE_REFRESH_INTERVAL_SECONDS: "120"
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_TELEMETRY_ENABLED: "false"
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
      SHOW_HOME_PAGE_REDESIGN: "true"
      SHOW_INGESTION_PAGE_REDESIGN: "true"
      SHOW_SEARCH_BAR_AUTOCOMPLETE_REDESIGN: "true"
      SHOW_HAS_SIBLINGS_FILTER: "true"
      THEME_V2_DEFAULT: "true"
      DATAHUB_EMIT_MODE: SYNC_PRIMARY
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://127.0.0.1:${DATAHUB_GMS_PORT:-8088}/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 90s

  datahub-actions:
    image: docker.io/acryldata/datahub-actions:v0.0.15
    hostname: actions
    container_name: datahub-actions
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    depends_on:
      - datahub-gms
    environment:
      DATAHUB_GMS_HOST: 127.0.0.1
      DATAHUB_GMS_PORT: "${DATAHUB_GMS_PORT:-8088}"
      DATAHUB_GMS_PROTOCOL: http
      DATAHUB_SYSTEM_CLIENT_ID: __datahub_system
      DATAHUB_SYSTEM_CLIENT_SECRET: JohnSnowKnowsNothing
      KAFKA_BOOTSTRAP_SERVER: 127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      SCHEMA_REGISTRY_URL: "http://127.0.0.1:${DATAHUB_GMS_PORT:-8088}/schema-registry/api/"

  datahub-frontend:
    image: docker.io/acryldata/datahub-frontend-react:v1.5.0.6
    hostname: datahub-frontend-react
    container_name: datahub-frontend-react
    network_mode: host
    user: "1000:1000"
    x-podman.uidmaps:
      - "1000:0:1"
    x-podman.gidmaps:
      - "1000:0:1"
    depends_on:
      - datahub-gms
    environment:
      DATAHUB_GMS_HOST: 127.0.0.1
      DATAHUB_GMS_PORT: "${DATAHUB_GMS_PORT:-8088}"
      DATAHUB_SECRET: "YouKnowNothing"
      DATAHUB_APP_VERSION: "v1.5.0.6"
      DATAHUB_PLAY_MEM_BUFFER_SIZE: "10MB"
      DATAHUB_TRACKING_TOPIC: DataHubUsageEvent_v1
      KAFKA_BOOTSTRAP_SERVER: 127.0.0.1:${KAFKA_PORT:-9092}
      ELASTIC_CLIENT_HOST: 127.0.0.1
      ELASTIC_CLIENT_PORT: "9200"
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
      THEME_V2_DEFAULT: "true"


