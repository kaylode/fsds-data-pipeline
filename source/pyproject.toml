[project]
name = "fsds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "acryl-datahub[feast,hive,hive-metastore,kafka,postgres,s3,trino]>=1.3.1.5",
    "confluent-kafka>=2.14.0",
    "deltalake>=1.2.1",
    "feast-trino>=1.0.1",
    "feast[trino]>=0.41.3",
    "imbalanced-learn>=0.12.4",
    "loguru>=0.7.3",
    "matplotlib>=3.9.4",
    "meds-reader>=0.1.16",
    "minio>=7.2.20",
    "mlflow>=1.27.0",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "podman-compose>=1.5.0",
    "polars>=1.36.1",
    "prometheus-client>=0.25.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary,pool]>=3.2.13",
    "pyarrow>=21.0.0",
    "pyspark==3.5.6",
    "python-dotenv>=1.2.1",
    "redis>=7.0.1",
    "regex>=2026.1.15",
    "tabulate>=0.9.0",
    "torch>=2.8.0",
    "tqdm>=4.67.3",
    "trino>=0.337.0",
    "avro",
    "cloudpickle>=3.1.2",
    "ruamel.yaml<0.19.0",
    "apache-beam[gcp]>=2.72.0",
    "apache-beam[tfrecord]>=2.72.0",
    "apache-flink>=2.2.0",
]


[dependency-groups]
flink = [
    "apache-flink==2.2.0",
]

[tool.uv]
override-dependencies = [
    "pemja>=0.5.5",
    "apache-beam>=2.72.0",
    "pyarrow>=21.0.0",
    "cloudpickle>=3.1.2",
    "ruamel.yaml>=0.18.5,<0.19.0",
    "pandas>=2.3.3",
]

[tool.uv.extra-build-dependencies]
pyarrow = ["setuptools"]
apache-beam = ["setuptools"]



